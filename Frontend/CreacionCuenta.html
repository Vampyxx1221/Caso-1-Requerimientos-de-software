<!DOCTYPE html>
<html lang = "es">
<head>
    <meta charset = "UTF-8">
    <link rel="stylesheet" href="diseño.css">
    <title>Crear Cuenta</title>
    
</head>

<body>

    <div class = "cuadro" >
        <h1>Creación de una cuenta</h1>

        <form id = "form-registro">
            <div class = "field">
                <label for = "username">Usuario: </label>
                <input type = "text"
                       id = "username"
                       name = "username" 
                required>
            </div>

            <div class = "field">
                <label>Correo: </label>
                <input type = "email"
                       id = "email"
                       name = "email" 
                required> 
            </div>
        
           <div class = "field">
                <label>Contraseña: </label>
                <input type = "password"
                       id = "password"
                       name = "password"
                required>
            </div>

            <button type="submit" class="btn-primary">Enviar</button>
        </form>

    </div>

    <!--- Conexión con el archivo de javaScript para capturar los datos-->
    <script src="main.js"></script>

</body>
