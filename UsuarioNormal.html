<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="diseño.css">
    <title>Panel de Usuario</title>
</head>

<body class="dashboard-body">

    <!-- Barra de Navegación Superior -->
    <header class="navbar">
        <div class="navbar-brand">
            <div class="logo-small">
                <div class="sq sq-1"></div>
                <div class="sq sq-2"></div>
                <div class="sq sq-3"></div>
                <div class="sq sq-4"></div>
            </div>
            <span>Sistema Autentificador</span>
        </div>
        <div class="navbar-user">
            <span class="badge-admin">Usuario Normal</span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-container">
        <div class="welcome-card">
            <h1>¡Bienvenido/a de nuevo!</h1>
            <p>Has ingresado al sistema con permisos de usuario <strong id="user-role"></strong>.</p>
            
            <div class="user-info-box">
                <h3>Información de tu sesión:</h3>
                <ul>
                    <li><strong>Usuario:</strong> <span id="info-username">...</span></li>
                    <li><strong>Correo:</strong> <span id="info-email">...</span></li>
                    <li><strong>Acceso a gestión:</strong> Restringido (Solo lectura)</li>
                </ul>
            </div>
        </div>
    </main>

    <!--- Conexión con el archivo de javaScript para capturar los datos-->
    <script src="main.js"></script>

</body>

</html>
