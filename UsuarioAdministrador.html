<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="diseño.css">
    <title>Panel de Administración</title>
</head>

<body class="dashboard-body">

    <header class="navbar navbar-admin">
        <div class="navbar-brand">
            <div class="logo-small">
                <div class="sq sq-1"></div>
                <div class="sq sq-2"></div>
                <div class="sq sq-3"></div>
                <div class="sq sq-4"></div>
            </div>
            <span>Centro de Administración</span>
        </div>
        <div class="navbar-user">
            <span class="badge-admin">Administrador</span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-container">
        
        <!-- Tabla limpia lista para recibir datos de Python -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre de Usuario</th>
                        <th>Correo Electrónico</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <!-- ID para que JS/Python inserte las filas dinámicamente -->
                <tbody id="tabla-usuarios">
                    <!-- Aquí se cargarán los datos de la BD -->
                </tbody>
            </table>
        </div>
    </main>

    <!--- Conexión con el archivo de javaScript para capturar los datos-->
    <script src="main.js"></script>

</body>

</html>
