<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="diseño.css">
    <title>Crear Cuenta</title>
    
</head>

<body>

    <div class = "cuadro" >
        <h1>Creación de una cuenta</h1>

    <form>
        <div class = "field">
            <label>Usuario</label>
            <input type = "text"
                   name = "Usuario" 
            required>
        </div>

        <div class = "field">
            <label>Email</label>
            <input type = "email"
                   name = "Email" 
            required> 
        </div>
        
        <div class = "field">
            <label>Contraseña</label>
            <input type = "password"
                   name = "Contraseña"
             required>
        </div>

        <button type="submit" class="btn-primary">Enviar</button>
    </form>

    </div>


</body>
