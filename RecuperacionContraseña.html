<!DOCTYPE html>
<html lang = "es">
<head>
    <meta charset = "UTF-8">
    <link rel="stylesheet" href="diseño.css">
    <title>Recuperar contraseña</title>
    
</head>

<body>

    <div class = "cuadro">
        <h1>Recuperación de contraseña</h1>
        <hr>
        <h2> Ingrese su correo para recuperar su cuenta</h2>

        <form id = "form-solicitar-codigo">
            <div class = "field">
                <label for = "recover-email">Email</label>
                <input type = "email"
                       id = "recover-email"
                      name = "email" 
                required>
            </div>
            <button type = "submit" class="btn-primary">Enviar Código</button>
        </form>
    
        <hr>

        <h2> Ingrese el código que se le envió</h2>

        <form id = "form-verificar-codigo">
            <div class = "field">
                <label for = "recover-code">Codigo</label>
                <input type = "text"
                       id = "recover-code"
                       name = "code" 
                required>
            </div>
            <button type = "submit" class = "btn-primary">Verificar</button>
        </form>
    </div>

    <!--- Conexión con el archivo de javaScript para capturar los datos-->
    <script src="main.js"></script>

</body>
